<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Car Visualizer V2</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  min-height:100vh;
  color:#f0f0f0;

  background:
  linear-gradient(
  -45deg,
  #050510,
  #101026,
  #18183b,
  #0a0a15);

  background-size:400% 400%;

  animation:gradientFlow 15s ease infinite;

  padding:20px;
}

@keyframes gradientFlow{
  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}

.container{
  max-width:1300px;
  margin:auto;
}

header{
  text-align:center;
  padding:50px 20px;
}

header h1{
  font-size:4rem;
  color:white;
}

header span{
  color:#4e8ef7;
}

header p{
  margin-top:10px;
  color:#999;
}

.panel{
  background:
  rgba(255,255,255,0.03);

  backdrop-filter:blur(15px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:20px;

  padding:25px;

  margin-bottom:20px;
}

.search-wrap{
  display:flex;
  gap:12px;
}

#searchInput{
  flex:1;

  padding:18px;

  background:#111;

  border:
  1px solid #333;

  color:white;

  border-radius:12px;

  font-size:17px;
}

#searchBtn{
  width:180px;

  border:none;

  border-radius:12px;

  background:#4e8ef7;

  color:white;

  font-size:17px;

  cursor:pointer;

  transition:.3s;
}

#searchBtn:hover{
  transform:translateY(-2px);
}

.car-card{
  display:none;

  overflow:hidden;

  border-radius:20px;

  background:
  rgba(255,255,255,0.03);

  border:
  1px solid rgba(255,255,255,0.08);

  animation:fadeUp .5s ease;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.car-image{
  width:100%;
  height:450px;
  object-fit:cover;
}

.card-header{
  padding:25px;
}

.card-header h2{
  font-size:2.5rem;
}

.specs-grid{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:15px;

  padding:20px;
}

.spec-box{
  background:#111;

  border:1px solid #222;

  border-radius:12px;

  padding:15px;
}

.spec-title{
  color:#777;
  margin-bottom:8px;
}

.spec-value{
  font-weight:bold;
  font-size:18px;
}

.garage-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.garage-item{
  background:#1a1a26;
  padding:10px 15px;
  border-radius:30px;
  border:1px solid #333;
}

.power-bar{
  height:14px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.power-fill{
  height:100%;
  width:0;
  transition:1s;
  background:
  linear-gradient(
  90deg,
  #4e8ef7,
  #b86af7);
}

.compare-grid{
  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:20px;
}
  button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background:#4e8ef7;
  color:white;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
}

#apiKey{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #333;
  background:#111;
  color:white;
}

@media(max-width:768px){

  .search-wrap{
    flex-direction:column;
  }

  #searchBtn{
    width:100%;
  }

  .compare-grid{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:2.5rem;
  }

}
</style>
</head>
<body>
<div class="container">

<header>
    <h1>Car <span>Visualizer</span></h1>

    <p>
        Search any car — exotic, classic,
        electric, SUV, hypercar or daily driver.
    </p>
</header>

<div class="panel">

    <h2 style="margin-bottom:20px;">
        ⭐ My Garage
    </h2>

    <div
      id="garage"
      class="garage-grid">
    </div>

</div>

<div class="panel">

    <input
      id="apiKey"
      placeholder="Groq API Key">

    <br><br>

    <div class="search-wrap">

        <input
          id="searchInput"
          placeholder="Search any car...">

        <button
          id="searchBtn"
          onclick="searchCar()">

            Search →

        </button>

    </div>

    <div
      style="
      margin-top:15px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;">

        <button onclick="quickSearch('Ferrari F40')">
            Ferrari F40
        </button>

        <button onclick="quickSearch('Bugatti Chiron')">
            Bugatti Chiron
        </button>

        <button onclick="quickSearch('McLaren P1')">
            McLaren P1
        </button>

        <button onclick="quickSearch('Toyota Supra MK4')">
            Supra MK4
        </button>

        <button onclick="quickSearch('Porsche 911 GT3 RS')">
            Porsche GT3 RS
        </button>

    </div>

</div>

<div class="panel">

    <h2 style="margin-bottom:15px;">
        📜 Search History
    </h2>

    <div id="history"></div>

</div>

<div
class="car-card"
id="carCard"
style="display:none">

    <img
      id="carImage"
      class="car-image">

    <div class="card-header">

        <h2 id="carName">
        </h2>

        <p
          id="carTagline"
          style="
          color:#aaa;
          margin-top:10px;">
        </p>

        <br>

        <span
          id="carClass"
          style="
          background:#4e8ef7;
          padding:8px 15px;
          border-radius:30px;
          font-weight:bold;">
        </span>

        <br><br>

        <div
          class="power-bar">

            <div
              id="powerFill"
              class="power-fill">
            </div>

        </div>

        <p
          id="powerLabel"
          style="
          margin-top:10px;
          font-size:18px;">
        </p>

        <br>

        <button
          onclick="saveFavorite()">

            ⭐ Save To Garage

        </button>

    </div>

    <div
      id="specsGrid"
      class="specs-grid">
    </div>

</div>
  
</div>

<script>
let favorites=JSON.parse(localStorage.getItem('garage')||'[]');
let historyData=JSON.parse(localStorage.getItem('history')||'[]');

function renderGarage(){

 let html='';

 favorites.forEach(car=>{

   html+=`
   <div class="garage-item">
      ${car}
   </div>
   `;

 });

 document.getElementById(
   'garage'
 ).innerHTML=
 html || 'No saved cars';

}
function renderHistory(){
 document.getElementById('history').innerHTML=historyData.slice(-10).reverse().join('<br>')||'No searches';
}
renderGarage();renderHistory();

function getClass(hp){
 if(hp>=1000)return 'Hypercar';
 if(hp>=700)return 'Supercar';
 if(hp>=350)return 'Sports Car';
 return 'Road Car';
}

async function searchCar(){
 const query=document.getElementById('searchInput').value.trim();
 const apiKey=document.getElementById('apiKey').value.trim();
 if(!query||!apiKey)return alert('Enter car and API key');

 historyData.push(query);
 localStorage.setItem('history',JSON.stringify(historyData));
 renderHistory();

 const systemMsg=`Return JSON only:
 {"make":"","model":"","year":"","type":"","origin":"","tagline":"","powerHp":500,
 "imageUrl":"",
 "specs":{"engine":"","power":"","torque":"","topSpeed":"","weight":"","drivetrain":""}}`;

 const response=await fetch("https://api.groq.com/openai/v1/chat/completions",{
 method:"POST",
 headers:{
 "Content-Type":"application/json",
 "Authorization":"Bearer "+apiKey
 },
 body:JSON.stringify({
 model:"llama-3.3-70b-versatile",
 messages:[
 {role:"system",content:systemMsg},
 {role:"user",content:"Car:"+query}
 ]
 })
 });

 const data=await response.json();
 let text=data.choices[0].message.content.trim();
 text=text.replace(/```json|```/g,'');
 const car=JSON.parse(text);

 document.getElementById('carCard').style.display='block';
 document.getElementById('carName').textContent=car.make+" "+car.model;
 document.getElementById('carTagline').textContent=car.tagline;
 document.getElementById('carClass').textContent=getClass(car.powerHp);

 document.getElementById('powerLabel').textContent=car.powerHp+" hp";
 document.getElementById('powerFill').style.width=Math.min(100,car.powerHp/15)+'%';

 if(car.imageUrl){
  const img=document.getElementById('carImage');
  img.src=car.imageUrl;
  img.style.display='block';
 }

 let html='';
 for(const [k,v] of Object.entries(car.specs)){
html+=`
<div class="spec-box">

   <div class="spec-title">
      ${k}
   </div>

   <div class="spec-value">
      ${v}
   </div>

</div>
`;
 }
 document.getElementById('specsGrid').innerHTML=html;
}

function quickSearch(car){

 document.getElementById(
   'searchInput'
 ).value = car;

 searchCar();

}

function saveFavorite(){
 const name=document.getElementById('carName').textContent;
 if(!name)return;
 favorites.push(name);
 localStorage.setItem('garage',JSON.stringify(favorites));
 renderGarage();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Car Visualizer V2</title>
<style>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  min-height:100vh;
  color:#f0f0f0;

  background:
  linear-gradient(
  -45deg,
  #050510,
  #101026,
  #18183b,
  #0a0a15);

  background-size:400% 400%;

  animation:gradientFlow 15s ease infinite;

  padding:20px;
}

@keyframes gradientFlow{
  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}

.container{
  max-width:1300px;
  margin:auto;
}

header{
  text-align:center;
  padding:50px 20px;
}

header h1{
  font-size:4rem;
  color:white;
}

header span{
  color:#4e8ef7;
}

header p{
  margin-top:10px;
  color:#999;
}

.panel{
  background:
  rgba(255,255,255,0.03);

  backdrop-filter:blur(15px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:20px;

  padding:25px;

  margin-bottom:20px;
}

.search-wrap{
  display:flex;
  gap:12px;
}

#searchInput{
  flex:1;

  padding:18px;

  background:#111;

  border:
  1px solid #333;

  color:white;

  border-radius:12px;

  font-size:17px;
}

#searchBtn{
  width:180px;

  border:none;

  border-radius:12px;

  background:#4e8ef7;

  color:white;

  font-size:17px;

  cursor:pointer;

  transition:.3s;
}

#searchBtn:hover{
  transform:translateY(-2px);
}

.car-card{
  display:none;

  overflow:hidden;

  border-radius:20px;

  background:
  rgba(255,255,255,0.03);

  border:
  1px solid rgba(255,255,255,0.08);

  animation:fadeUp .5s ease;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.car-image{
  width:100%;
  height:450px;
  object-fit:cover;
}

.card-header{
  padding:25px;
}

.card-header h2{
  font-size:2.5rem;
}

.specs-grid{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:15px;

  padding:20px;
}

.spec-box{
  background:#111;

  border:1px solid #222;

  border-radius:12px;

  padding:15px;
}

.spec-title{
  color:#777;
  margin-bottom:8px;
}

.spec-value{
  font-weight:bold;
  font-size:18px;
}

.garage-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.garage-item{
  background:#1a1a26;
  padding:10px 15px;
  border-radius:30px;
  border:1px solid #333;
}

.power-bar{
  height:14px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.power-fill{
  height:100%;
  width:0;
  transition:1s;
  background:
  linear-gradient(
  90deg,
  #4e8ef7,
  #b86af7);
}

.compare-grid{
  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:20px;
}

@media(max-width:768px){

  .search-wrap{
    flex-direction:column;
  }

  #searchBtn{
    width:100%;
  }

  .compare-grid{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:2.5rem;
  }

}
</style>
</style>
</head>
<body>
<div class="container">
<h1>🚗 Car Visualizer V2</h1>

<div class="panel">
<h3>My Garage</h3>
<div id="garage"></div>
</div>

<div class="card">
<input id="apiKey" placeholder="Groq API Key">
<br><br>
<div class="row">
<input id="searchInput" placeholder="Ferrari F40">
<button onclick="searchCar()">Search</button>
<button onclick="saveFavorite()">⭐ Save</button>
</div>
</div>

<div class="panel">
<h3>Search History</h3>
<div id="history"></div>
</div>

<div class="card" id="carCard" style="display:none">
<img id="carImage">
<h2 id="carName"></h2>
<p id="carTagline"></p>
<div id="carClass"></div>
<div style="background:#111;height:10px;border-radius:6px">
<div id="powerFill" style="height:10px;width:0;background:#4e8ef7"></div>
</div>
<p id="powerLabel"></p>
<div class="grid" id="specsGrid"></div>
</div>
</div>

<script>
let favorites=JSON.parse(localStorage.getItem('garage')||'[]');
let historyData=JSON.parse(localStorage.getItem('history')||'[]');

function renderGarage(){
 document.getElementById('garage').innerHTML=favorites.join('<br>')||'No saved cars';
}
function renderHistory(){
 document.getElementById('history').innerHTML=historyData.slice(-10).reverse().join('<br>')||'No searches';
}
renderGarage();renderHistory();

function getClass(hp){
 if(hp>=1000)return 'Hypercar';
 if(hp>=700)return 'Supercar';
 if(hp>=350)return 'Sports Car';
 return 'Road Car';
}

async function searchCar(){
 const query=document.getElementById('searchInput').value.trim();
 const apiKey=document.getElementById('apiKey').value.trim();
 if(!query||!apiKey)return alert('Enter car and API key');

 historyData.push(query);
 localStorage.setItem('history',JSON.stringify(historyData));
 renderHistory();

 const systemMsg=`Return JSON only:
 {"make":"","model":"","year":"","type":"","origin":"","tagline":"","powerHp":500,
 "imageUrl":"",
 "specs":{"engine":"","power":"","torque":"","topSpeed":"","weight":"","drivetrain":""}}`;

 const response=await fetch("https://api.groq.com/openai/v1/chat/completions",{
 method:"POST",
 headers:{
 "Content-Type":"application/json",
 "Authorization":"Bearer "+apiKey
 },
 body:JSON.stringify({
 model:"llama-3.3-70b-versatile",
 messages:[
 {role:"system",content:systemMsg},
 {role:"user",content:"Car:"+query}
 ]
 })
 });

 const data=await response.json();
 let text=data.choices[0].message.content.trim();
 text=text.replace(/```json|```/g,'');
 const car=JSON.parse(text);

 document.getElementById('carCard').style.display='block';
 document.getElementById('carName').textContent=car.make+" "+car.model;
 document.getElementById('carTagline').textContent=car.tagline;
 document.getElementById('carClass').textContent=getClass(car.powerHp);

 document.getElementById('powerLabel').textContent=car.powerHp+" hp";
 document.getElementById('powerFill').style.width=Math.min(100,car.powerHp/15)+'%';

 if(car.imageUrl){
  const img=document.getElementById('carImage');
  img.src=car.imageUrl;
  img.style.display='block';
 }

 let html='';
 for(const [k,v] of Object.entries(car.specs)){
   html+=`<div class="spec"><b>${k}</b><br>${v}</div>`;
 }
 document.getElementById('specsGrid').innerHTML=html;
}

function saveFavorite(){
 const name=document.getElementById('carName').textContent;
 if(!name)return;
 favorites.push(name);
 localStorage.setItem('garage',JSON.stringify(favorites));
 renderGarage();
}
</script>
</body>
</html>
